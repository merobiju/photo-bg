name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            cgo: "0"
            ext: .exe
            tags: "desktop,production,native_webview2loader"
            ldflags: "-H=windowsgui -s -w"
            cgo_flags: ""
            artifact: Photo_BG_Windows_64bit_Most_PCs
          - os: windows-latest
            goos: windows
            goarch: "386"
            cgo: "0"
            ext: .exe
            tags: "desktop,production,native_webview2loader"
            ldflags: "-H=windowsgui -s -w"
            cgo_flags: ""
            artifact: Photo_BG_Windows_32bit_Old_PCs
          - os: windows-latest
            goos: windows
            goarch: arm64
            cgo: "0"
            ext: .exe
            tags: "desktop,production,native_webview2loader"
            ldflags: "-H=windowsgui -s -w"
            cgo_flags: ""
            artifact: Photo_BG_Windows_ARM_Surface
          - os: macos-latest
            goos: darwin
            goarch: arm64
            cgo: "1"
            ext: ""
            tags: "desktop,production"
            ldflags: "-s -w"
            cgo_flags: "-arch arm64"
            artifact: Photo_BG_Mac_New_M1_M2_M3_M4
          - os: macos-latest
            goos: darwin
            goarch: amd64
            cgo: "1"
            ext: ""
            tags: "desktop,production"
            ldflags: "-s -w"
            cgo_flags: "-arch x86_64"
            artifact: Photo_BG_Mac_Old_Intel
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            cgo: "1"
            ext: ""
            tags: "desktop,production,webkit2_41"
            ldflags: "-s -w"
            cgo_flags: ""
            artifact: Photo_BG_Linux_64bit

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build Binary
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_CFLAGS: ${{ matrix.cgo_flags }}
          CGO_LDFLAGS: ${{ runner.os == 'macOS' && format('{0} -framework Cocoa -framework WebKit -framework UniformTypeIdentifiers', matrix.cgo_flags) || matrix.cgo_flags }}
        run: |
          mkdir -p dist_pkg
          go build -tags "${{ matrix.tags }}" -ldflags "${{ matrix.ldflags }}" -o "dist_pkg/Photo_BG${{ matrix.ext }}" .
      - name: Build Windows Next-Next Setup Installer (NSIS)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $progFiles = if ("${{ matrix.goarch }}" -eq "386") { "`$PROGRAMFILES" } else { "`$PROGRAMFILES64" }
          $nsi = @"
          !include "MUI2.nsh"
          Name "Photo BG - Offline HD Studio"
          OutFile "${{ matrix.artifact }}_Setup.exe"
          InstallDir "$progFiles\Photo BG"
          RequestExecutionLevel admin
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !define MUI_FINISHPAGE_RUN "`$INSTDIR\Photo_BG.exe"
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"
          Section "Install"
            SetOutPath "`$INSTDIR"
            File "dist_pkg\Photo_BG.exe"
            CreateDirectory "`$SMPROGRAMS\Photo BG"
            CreateShortcut "`$SMPROGRAMS\Photo BG\Photo BG.lnk" "`$INSTDIR\Photo_BG.exe"
            CreateShortcut "`$DESKTOP\Photo BG.lnk" "`$INSTDIR\Photo_BG.exe"
            WriteUninstaller "`$INSTDIR\Uninstall.exe"
          SectionEnd
          Section "Uninstall"
            Delete "`$INSTDIR\Photo_BG.exe"
            Delete "`$INSTDIR\Uninstall.exe"
            Delete "`$DESKTOP\Photo BG.lnk"
            RMDir /r "`$SMPROGRAMS\Photo BG"
            RMDir "`$INSTDIR"
          SectionEnd
          "@
          Set-Content -Path "installer.nsi" -Value $nsi
          makensis installer.nsi

      - name: Package Windows Portable Archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist_pkg/* -DestinationPath ${{ matrix.artifact }}_Portable.zip -Force

      - name: Package Unix Archives (.zip and .tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist_pkg
          zip -r ../${{ matrix.artifact }}.zip .
          tar -czvf ../${{ matrix.artifact }}.tar.gz .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            ${{ matrix.artifact }}_Setup.exe
            ${{ matrix.artifact }}_Portable.zip
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
