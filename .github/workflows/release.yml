name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            goos: windows
            goarch: amd64
            cgo: "0"
            ext: .exe
            tags: "desktop,production,native_webview2loader"
            ldflags: "-H=windowsgui -s -w"
            cgo_flags: ""
            artifact: Photo_BG_Windows_x64_Portable
          - os: windows-latest
            goos: windows
            goarch: "386"
            cgo: "0"
            ext: .exe
            tags: "desktop,production,native_webview2loader"
            ldflags: "-H=windowsgui -s -w"
            cgo_flags: ""
            artifact: Photo_BG_Windows_x86_32bit
          - os: windows-latest
            goos: windows
            goarch: arm64
            cgo: "0"
            ext: .exe
            tags: "desktop,production,native_webview2loader"
            ldflags: "-H=windowsgui -s -w"
            cgo_flags: ""
            artifact: Photo_BG_Windows_ARM64
          - os: macos-latest
            goos: darwin
            goarch: arm64
            cgo: "1"
            ext: ""
            tags: "desktop,production"
            ldflags: "-s -w"
            cgo_flags: "-arch arm64"
            artifact: Photo_BG_macOS_AppleSilicon_M1_M4
          - os: macos-latest
            goos: darwin
            goarch: amd64
            cgo: "1"
            ext: ""
            tags: "desktop,production"
            ldflags: "-s -w"
            cgo_flags: "-arch x86_64"
            artifact: Photo_BG_macOS_Intel_x64
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            cgo: "1"
            ext: ""
            tags: "desktop,production,webkit2_41"
            ldflags: "-s -w"
            cgo_flags: ""
            artifact: Photo_BG_Linux_Ubuntu_Debian_x64
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            cgo: "1"
            ext: ""
            tags: "desktop,production,webkit2_41"
            ldflags: "-s -w"
            cgo_flags: ""
            artifact: Photo_BG_Linux_Fedora_Arch_x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Install Linux Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Build Binary
        shell: bash
        env:
          CGO_ENABLED: ${{ matrix.cgo }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_CFLAGS: ${{ matrix.cgo_flags }}
          CGO_LDFLAGS: ${{ matrix.cgo_flags }}
        run: |
          mkdir -p dist_pkg
          go build -tags "${{ matrix.tags }}" -ldflags "${{ matrix.ldflags }}" -o "dist_pkg/Photo_BG${{ matrix.ext }}" .

      - name: Package Windows Archives
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist_pkg/* -DestinationPath ${{ matrix.artifact }}.zip -Force

      - name: Package Unix Archives (.zip and .tar.gz)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd dist_pkg
          zip -r ../${{ matrix.artifact }}.zip .
          tar -czvf ../${{ matrix.artifact }}.tar.gz .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            ${{ matrix.artifact }}.zip
            ${{ matrix.artifact }}.tar.gz
