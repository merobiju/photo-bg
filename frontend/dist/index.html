<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo BG</title>
<style>
/* ===== Apple color system ===== */
:root{
  --bg:#F5F5F7; --card:#FFFFFF; --elev:#F2F2F7; --hair:rgba(0,0,0,.08);
  --text:#1D1D1F; --text2:#6E6E73;
  --blue:#007AFF; --green:#34C759; --red:#FF3B30;
  --blue-soft:rgba(0,122,255,.12); --blue-line:rgba(0,122,255,.35);
  --track:#E5E5EA; --seg-active:#FFFFFF;
  --check-a:#FFFFFF; --check-b:#E6E6EB;
  --pill-bg:rgba(255,255,255,.78);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
  --r-card:16px; --r-ctl:10px;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#161618; --card:#242426; --elev:#2C2C2E; --hair:rgba(255,255,255,.11);
  --text:#F5F5F7; --text2:#98989D;
  --blue:#0A84FF; --green:#30D158; --red:#FF453A;
  --blue-soft:rgba(10,132,255,.22); --blue-line:rgba(10,132,255,.5);
  --track:#3A3A3C; --seg-active:#636366;
  --check-a:#2B2B2D; --check-b:#38383A;
  --pill-bg:rgba(44,44,46,.78);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark;
}

/* ===== Base ===== */
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font); font-size:13px; line-height:1.35;
  background:var(--bg); color:var(--text); overflow:hidden;
  -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none;
  --wails-drop-target:drop; /* whole window accepts native file drops */
  transition:background-color .2s ease,color .2s ease;
}
input[type=text]{user-select:text;-webkit-user-select:text}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.tnum,#queueCount,#zoomLbl,#transVal,#boldVal,#statusText{font-variant-numeric:tabular-nums}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--track);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

.app{display:flex;flex-direction:column;height:100vh}

/* ===== Top bar ===== */
.topbar{
  flex:none;height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:0 16px;background:var(--card);border-bottom:1px solid var(--hair);
  transition:background-color .2s ease,border-color .2s ease;
}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand-name{font-size:17px;font-weight:700;letter-spacing:-.02em}
.brand-icon .bi-bg{fill:var(--blue)}
.pill{
  font-size:10px;font-weight:700;letter-spacing:.06em;padding:3px 8px;border-radius:999px;
  color:var(--blue);background:var(--blue-soft);
}
.top-actions{display:flex;align-items:center;gap:8px;flex:1;min-width:0;justify-content:flex-end}
.path-input{
  flex:1;min-width:120px;max-width:460px;height:34px;padding:0 12px;border-radius:var(--r-ctl);
  border:1px solid var(--hair);background:var(--elev);color:var(--text);font:inherit;font-size:13px;
  transition:background-color .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.path-input::placeholder{color:var(--text2)}
.path-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}

.btn{
  height:34px;padding:0 14px;border-radius:var(--r-ctl);border:1px solid var(--hair);
  background:var(--card);color:var(--text);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease,filter .15s ease,transform .1s ease;
}
.btn:hover{background:var(--elev)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--blue);border-color:transparent;color:#fff}
.btn.primary:hover{filter:brightness(1.08);background:var(--blue)}
.btn.block{width:100%;height:40px}
.btn.cta{height:44px;font-size:14px;font-weight:600}
.btn.cta.done{background:var(--green)}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}
.icon-btn{
  width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:var(--r-ctl);
  border:1px solid var(--hair);background:var(--card);color:var(--text);cursor:pointer;
  transition:background-color .2s ease,color .2s ease,border-color .2s ease;
}
.icon-btn:hover{background:var(--elev)}
.icon-sun{display:none}
:root[data-theme="dark"] .icon-sun{display:block}
:root[data-theme="dark"] .icon-moon{display:none}

/* ===== Workspace ===== */
.workspace{
  flex:1;min-height:0;display:grid;grid-template-columns:250px 1fr 290px;gap:12px;padding:12px 12px 52px;
}
.panel{
  min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--card);
  border:1px solid var(--hair);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;
  transition:background-color .2s ease,border-color .2s ease,box-shadow .2s ease;
}
.panel-head{
  flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 14px 8px;
}
.panel-title{font-size:11px;font-weight:700;letter-spacing:.07em;color:var(--text2)}
.link-btn{border:0;background:none;color:var(--blue);font-size:13px;font-weight:500;cursor:pointer;padding:2px 4px;border-radius:6px}
.link-btn:hover{background:var(--blue-soft)}
.link-btn:disabled{opacity:.4;cursor:default;pointer-events:none}

/* Queue */
.file-list{flex:1;min-height:0;overflow-y:auto;padding:2px 8px 10px}
.item{
  position:relative;display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:10px;
  border:1px solid transparent;cursor:pointer;transition:background-color .15s ease,border-color .15s ease;
}
.item:hover{background:var(--elev)}
.item.active{background:var(--blue-soft);border-color:var(--blue-line)}
.thumb{width:38px;height:38px;flex:none;border-radius:8px;background:var(--elev);overflow:hidden;box-shadow:inset 0 0 0 1px var(--hair)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.name{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-remove{
  flex:none;width:22px;height:22px;display:grid;place-items:center;border:0;border-radius:50%;
  background:var(--track);color:var(--text2);font-size:15px;line-height:1;cursor:pointer;opacity:0;
  transition:opacity .15s ease,background-color .15s ease,color .15s ease;
}
.item:hover .item-remove,.item-remove:focus-visible{opacity:1}
.item-remove:hover{background:var(--red);color:#fff}

/* Stage */
.canvas-toolbar{
  flex:none;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 10px;
  padding:10px 12px;border-bottom:1px solid var(--hair);
}
.seg{display:inline-flex;padding:2px;gap:2px;background:var(--elev);border-radius:9px;transition:background-color .2s ease}
.seg button{
  border:0;background:transparent;color:var(--text);font-size:12px;font-weight:500;padding:5px 11px;
  border-radius:7px;cursor:pointer;white-space:nowrap;transition:background-color .15s ease,box-shadow .15s ease;
}
.seg button.active{background:var(--seg-active);box-shadow:0 1px 2px rgba(0,0,0,.14),0 0 0 .5px var(--hair)}
.seg.full{display:flex;width:100%}
.seg.full button{flex:1;padding:6px 4px}
.zoom{display:flex;align-items:center;gap:4px}
.mini{
  min-width:26px;height:26px;padding:0 7px;border:0;border-radius:7px;background:var(--elev);color:var(--text);
  font-size:13px;font-weight:600;cursor:pointer;transition:background-color .15s ease;
}
.mini:hover{background:var(--track)}
#zoomLbl{min-width:42px;text-align:center;font-size:12px;color:var(--text2)}

.compare-box{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:default}
.bg-checker{
  background-color:var(--check-a);
  background-image:linear-gradient(45deg,var(--check-b) 25%,transparent 25%,transparent 75%,var(--check-b) 75%),
                   linear-gradient(45deg,var(--check-b) 25%,transparent 25%,transparent 75%,var(--check-b) 75%);
  background-size:16px 16px;background-position:0 0,8px 8px;
}
.bg-white{background:#fff}
.bg-dark{background:#1C1C1E}
.compare-box.has-image.mode-compare{cursor:ew-resize}
.compare-box.has-image.mode-move{cursor:grab}
.compare-box.has-image.space-pan{cursor:grab}
.compare-box.has-image.panning{cursor:grabbing}
body:has(.wails-drop-target-active) #compareBox{box-shadow:inset 0 0 0 3px var(--blue)}
body.wails-drop-target-active #compareBox{box-shadow:inset 0 0 0 3px var(--blue)}

.stage{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;display:none}
.has-image .stage{display:block}
.stage img{position:absolute;display:block;max-width:none;pointer-events:none;-webkit-user-drag:none}
#imgClean{left:0;top:0;width:100%;height:100%}
.orig-layer{position:absolute;inset:0;overflow:hidden}
.tag{
  position:absolute;top:10px;display:none;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:600;
  letter-spacing:.04em;color:#fff;background:rgba(0,0,0,.45);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  pointer-events:none;z-index:6;
}
.tag-l{left:10px}.tag-r{right:10px}
.has-image .tag{display:block}
.slider-line{position:absolute;top:0;bottom:0;left:50%;width:0;display:none;pointer-events:none;z-index:5}
.has-image .slider-line{display:block}
.slider-line::before{
  content:"";position:absolute;top:0;bottom:0;left:-.75px;width:1.5px;background:rgba(255,255,255,.92);
  box-shadow:0 0 0 .5px rgba(0,0,0,.3);
}
.handle{
  position:absolute;top:50%;left:0;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;font-size:15px;font-weight:600;color:#1D1D1F;
  background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.75);
  backdrop-filter:blur(14px) saturate(180%);-webkit-backdrop-filter:blur(14px) saturate(180%);
  box-shadow:0 2px 10px rgba(0,0,0,.25);
}

.empty-state{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;text-align:center;padding:24px;pointer-events:none;z-index:4;
}
.empty-state.hidden{display:none}
.empty-icon{
  width:68px;height:68px;border-radius:20px;display:grid;place-items:center;margin-bottom:8px;
  color:var(--blue);background:var(--card);box-shadow:var(--shadow);border:1px solid var(--hair);
}
.empty-title{font-size:17px;font-weight:600;letter-spacing:-.01em;color:var(--text)}
.empty-sub{font-size:12.5px;color:var(--text2)}
.bg-white .empty-title{color:#1D1D1F}.bg-white .empty-sub{color:#6E6E73}
.bg-dark .empty-title{color:#F5F5F7}.bg-dark .empty-sub{color:#98989D}

/* Controls */
.controls{overflow-y:auto}
.controls-inner{padding:14px;display:flex;flex-direction:column;gap:16px}
.ctl-row{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:6px}
.ctl-label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--text2);margin-bottom:6px}
.ctl-row .ctl-label{margin-bottom:0}
.val{font-size:13px;font-weight:600;color:var(--text)}
.hint{margin-top:2px;font-size:11px;color:var(--text2)}
.ios-range{
  -webkit-appearance:none;appearance:none;width:100%;height:28px;margin:0;background:transparent;cursor:pointer;--p:50%;
}
.ios-range:focus-visible{outline:none}
.ios-range::-webkit-slider-runnable-track{
  height:4px;border-radius:2px;background:linear-gradient(to right,var(--blue) var(--p),var(--track) var(--p));
}
.ios-range::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:#fff;
  border:.5px solid rgba(0,0,0,.1);box-shadow:0 1px 1px rgba(0,0,0,.1),0 3px 8px rgba(0,0,0,.28);
}
.ios-range:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--blue-soft),0 3px 8px rgba(0,0,0,.28)}
.group{background:var(--elev);border-radius:var(--r-ctl);overflow:hidden;transition:background-color .2s ease}
.toggle{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;cursor:pointer}
.toggle + .toggle{border-top:1px solid var(--hair)}
.toggle span:first-child{font-size:13px}
.toggle input{position:absolute;opacity:0;pointer-events:none}
.switch{position:relative;flex:none;width:42px;height:26px;border-radius:13px;background:var(--track);transition:background-color .2s ease}
.switch::after{
  content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s ease;
}
.toggle input:checked + .switch{background:var(--green)}
.toggle input:checked + .switch::after{transform:translateX(16px)}
.toggle input:focus-visible + .switch{outline:2px solid var(--blue);outline-offset:2px}
.actions{display:flex;flex-direction:column;gap:8px}
.util-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn.secondary{background:var(--elev);border-color:transparent}
.btn.secondary:hover{background:var(--track)}

/* Floating status pill */
.status{
  position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:50;max-width:min(760px,calc(100vw - 48px));
  padding:8px 16px;border-radius:999px;font-size:12.5px;color:var(--text2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;pointer-events:none;background:var(--pill-bg);border:1px solid var(--hair);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:var(--shadow);
  transition:background-color .2s ease,color .2s ease,border-color .2s ease;
}
.status::before{
  content:"";display:inline-block;vertical-align:middle;width:7px;height:7px;margin:-2px 8px 0 0;border-radius:50%;
  background:var(--text2);
}
.status[data-kind="ok"]{color:var(--text)}.status[data-kind="ok"]::before{background:var(--green)}
.status[data-kind="err"]{color:var(--text)}.status[data-kind="err"]::before{background:var(--red)}
.status[data-kind="busy"]{color:var(--text)}
.status[data-kind="busy"]::before{background:var(--blue);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.status[data-kind="busy"]::before{animation:none}}

/* ===== Responsive down to 980x660 ===== */
@media (max-width:1100px){
  .workspace{grid-template-columns:218px 1fr 258px;gap:10px;padding:10px 10px 50px}
  .seg button{padding:5px 8px}
  .controls-inner{padding:12px;gap:14px}
}
@media (max-height:720px){
  .controls-inner{gap:12px}
  .btn.cta{height:40px}.btn.block{height:36px}
  .toggle{padding:8px 12px}
}
</style>
</head>
<body>
<div class="app">

  <!-- ===== Header ===== -->
  <header class="topbar">
        <div class="brand">
      <svg class="brand-icon" viewBox="0 0 100 100" width="30" height="30" aria-hidden="true">
        <g stroke="#18191C" stroke-width="26" stroke-linecap="round">
          <line x1="50" y1="22" x2="50" y2="78"/>
          <line x1="22" y1="50" x2="78" y2="50"/>
          <line x1="30.2" y1="30.2" x2="69.8" y2="69.8"/>
          <line x1="69.8" y1="30.2" x2="30.2" y2="69.8"/>
        </g>
        <g stroke="#FFB03A" stroke-width="7.5" stroke-linecap="round">
          <line x1="50" y1="22" x2="50" y2="78"/>
          <line x1="22" y1="50" x2="78" y2="50"/>
          <line x1="30.2" y1="30.2" x2="69.8" y2="69.8"/>
          <line x1="69.8" y1="30.2" x2="30.2" y2="69.8"/>
        </g>
        <g fill="#FFB03A">
          <circle cx="50" cy="50" r="10"/>
          <circle cx="50" cy="22" r="6.8"/>
          <circle cx="50" cy="78" r="6.8"/>
          <circle cx="22" cy="50" r="6.8"/>
          <circle cx="78" cy="50" r="6.8"/>
          <circle cx="30.2" cy="30.2" r="6.8"/>
          <circle cx="69.8" cy="69.8" r="6.8"/>
          <circle cx="69.8" cy="30.2" r="6.8"/>
          <circle cx="30.2" cy="69.8" r="6.8"/>
        </g>
      </svg>
      <span class="brand-name">Photo BG</span>
      <span class="pill">Made in Nepal</span>
      <span class="pill">by Bijaya Pokhrel</span>
    </div>
    <div class="top-actions">
      <input id="pathInput" class="path-input" type="text" spellcheck="false" autocomplete="off"
             placeholder="Paste folder or image path, or drop files below..." aria-label="Folder or image path">
      <button id="btnFiles" class="btn" type="button">+ Files</button>
      <button id="btnFolder" class="btn primary" type="button">+ Folder</button>
      <button id="themeToggle" class="icon-btn" type="button" title="Switch light / dark" aria-label="Toggle theme">
        <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <!-- ===== Workspace ===== -->
  <main class="workspace">

    <!-- Queue -->
    <aside class="panel">
      <div class="panel-head">
        <span id="queueCount" class="panel-title">QUEUE (0)</span>
        <button id="btnClearQueue" class="link-btn" type="button">Clear</button>
      </div>
      <div id="fileList" class="file-list" aria-label="Photo queue"></div>
    </aside>

    <!-- Canvas -->
    <section class="panel">
      <div class="canvas-toolbar">
        <div class="seg" id="bgSeg" role="group" aria-label="Preview background">
          <button type="button" data-bg="checker" class="active">Checker</button>
          <button type="button" data-bg="white">White</button>
          <button type="button" data-bg="dark">Dark</button>
        </div>
        <div class="seg" role="group" aria-label="Canvas mode">
          <button id="modeCompare" type="button" class="active">Compare</button>
          <button id="modeMove" type="button">Move</button>
        </div>
        <div class="zoom">
          <button id="zoomOut" class="mini" type="button" title="Zoom out (-)">&minus;</button>
          <span id="zoomLbl">100%</span>
          <button id="zoomIn" class="mini" type="button" title="Zoom in (+)">+</button>
          <button id="zoomFit" class="mini" type="button" title="Fit (0)">Fit</button>
        </div>
      </div>

      <div id="compareBox" class="compare-box bg-checker mode-compare">
        <div id="emptyState" class="empty-state">
          <div class="empty-icon">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4"/><path d="M7.5 8.5L12 4l4.5 4.5"/><path d="M4 14v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg>
          </div>
          <div class="empty-title">Drop Photos or a Folder Here</div>
          <div class="empty-sub">100% Offline &bull; Private Local Processing</div>
        </div>
        <div id="stage" class="stage">
          <img id="imgClean" alt="Result" draggable="false">
          <div id="origLayer" class="orig-layer"><img id="imgOrig" alt="Original" draggable="false"></div>
        </div>
        <span class="tag tag-l">ORIGINAL</span>
        <span class="tag tag-r">RESULT</span>
        <div id="sliderLine" class="slider-line"><div class="handle">&harr;</div></div>
      </div>
    </section>

    <!-- Studio controls -->
    <aside class="panel controls">
      <div class="controls-inner">
        <div>
          <div class="ctl-label">Color Preset</div>
          <div class="seg full" id="colorSeg" role="group" aria-label="Color preset">
            <button type="button" data-color="original" class="active">Original</button>
            <button type="button" data-color="black">Pure Black</button>
            <button type="button" data-color="blue">Blue Ink</button>
          </div>
        </div>

        <div>
          <div class="ctl-row"><span class="ctl-label">Transparency</span><span id="transVal" class="val">50%</span></div>
          <input id="transSlider" class="ios-range" type="range" min="0" max="100" step="1" value="50" aria-label="Transparency">
          <div class="hint">Higher removes more background</div>
        </div>

        <div>
          <div class="ctl-row"><span class="ctl-label">Edge Boldness</span><span id="boldVal" class="val">50%</span></div>
          <input id="boldSlider" class="ios-range" type="range" min="0" max="100" step="1" value="50" aria-label="Edge boldness">
          <div class="hint">Higher makes edges crisper and bolder</div>
        </div>

        <div class="group">
          <label class="toggle"><span>Trim Empty Edges (Auto-Crop)</span><input type="checkbox" id="autoCrop"><span class="switch"></span></label>
          <label class="toggle"><span>Resize for Forms (600&times;200)</span><input type="checkbox" id="formSize"><span class="switch"></span></label>
        </div>

        <div class="actions">
          <button id="btnProcessAll" class="btn primary block cta" type="button">Process All Images</button>
          <button id="btnSaveOne" class="btn secondary block" type="button">Save Current PNG</button>
          <div class="util-row">
            <button id="btnOpenOut" class="btn secondary block" type="button">Open Folder</button>
            <button id="btnExportZip" class="btn secondary block" type="button">Export ZIP</button>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <div id="statusText" class="status" data-kind="idle" role="status" aria-live="polite">Ready</div>
</div>

<script>
(() => {
"use strict";

/* =====================================================================
   DOM + constants
   ===================================================================== */
const $ = (id) => document.getElementById(id);
const el = {
  pathInput: $("pathInput"), btnFiles: $("btnFiles"), btnFolder: $("btnFolder"), themeToggle: $("themeToggle"),
  queueCount: $("queueCount"), btnClear: $("btnClearQueue"), fileList: $("fileList"),
  compareBox: $("compareBox"), emptyState: $("emptyState"), stage: $("stage"),
  imgClean: $("imgClean"), origLayer: $("origLayer"), imgOrig: $("imgOrig"), sliderLine: $("sliderLine"),
  bgSeg: $("bgSeg"), modeCompare: $("modeCompare"), modeMove: $("modeMove"),
  zoomLbl: $("zoomLbl"), zoomIn: $("zoomIn"), zoomOut: $("zoomOut"), zoomFit: $("zoomFit"),
  colorSeg: $("colorSeg"), transSlider: $("transSlider"), boldSlider: $("boldSlider"),
  transVal: $("transVal"), boldVal: $("boldVal"), autoCrop: $("autoCrop"), formSize: $("formSize"),
  btnSaveOne: $("btnSaveOne"), btnProcessAll: $("btnProcessAll"), btnOpenOut: $("btnOpenOut"),
  btnExportZip: $("btnExportZip"), statusText: $("statusText"),
};

const HINT = "Ready \u00B7 Ctrl/\u2318+O files \u00B7 Ctrl/\u2318+Shift+O folder \u00B7 Space+drag to pan";
const THEME_KEY = "photobg-theme";
const ZMIN = 0.25, ZMAX = 6;
const THUMB_CONCURRENCY = 4;
const CACHE_MAX = 30;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const baseName = (p) => String(p).split(/[\\/]/).pop();

// Every Go call goes through backend() => window.go.main.App
const backend = () => (window.go && window.go.main && window.go.main.App) || null;

/* =====================================================================
   Status pill
   ===================================================================== */
let statusTimer = 0;
function setStatus(text, kind = "idle") {
  el.statusText.textContent = text;
  el.statusText.dataset.kind = kind;
  clearTimeout(statusTimer);
  if (kind === "ok" || kind === "err") {
    statusTimer = setTimeout(() => {
      el.statusText.textContent = HINT;
      el.statusText.dataset.kind = "idle";
    }, kind === "err" ? 9000 : 6000);
  }
}

/* =====================================================================
   Theme
   ===================================================================== */
function setTheme(theme, persist) {
  document.documentElement.setAttribute("data-theme", theme);
  el.themeToggle.setAttribute("aria-pressed", String(theme === "dark"));
  if (persist) { try { localStorage.setItem(THEME_KEY, theme); } catch (e) { /* ignore */ } }
}
function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem(THEME_KEY); } catch (e) { /* ignore */ }
  const mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
  setTheme(saved === "dark" || saved === "light" ? saved : (mq && mq.matches ? "dark" : "light"), false);
  el.themeToggle.addEventListener("click", () => {
    const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
    setTheme(next, true);
  });
  if (mq && mq.addEventListener) {
    mq.addEventListener("change", (e) => {
      let s = null;
      try { s = localStorage.getItem(THEME_KEY); } catch (err) { /* ignore */ }
      if (!s) setTheme(e.matches ? "dark" : "light", false);
    });
  }
}

/* =====================================================================
   App state
   ===================================================================== */
const state = { color: "original", trans: 50, bold: 50, autoCrop: false, formSize: false };
let queuePaths = [];
let activeIndex = -1;
let isBusy = false;
let canvasMode = "compare";
let spaceDown = false;

const itemEls = new Map(); // path -> DOM node

/* =====================================================================
   Queue UI
   ===================================================================== */
function updateButtons() {
  const has = queuePaths.length > 0;
  el.btnSaveOne.disabled = !has || isBusy;
  el.btnProcessAll.disabled = !has || isBusy;
  el.btnExportZip.disabled = !has || isBusy;
  el.btnOpenOut.disabled = !has;
  el.btnClear.disabled = !has;
  el.btnProcessAll.textContent = isBusy ? "Processing\u2026" : "Process All Images";
}
function updateQueueUI() {
  el.queueCount.textContent = "QUEUE (" + queuePaths.length + ")";
  el.emptyState.classList.toggle("hidden", queuePaths.length > 0);
  updateButtons();
}

function buildItem(path) {
  const node = document.createElement("div");
  node.className = "item";
  node.dataset.path = path;
  node.title = path;
  const thumb = document.createElement("div");
  thumb.className = "thumb";
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = baseName(path);
  const rm = document.createElement("button");
  rm.className = "item-remove";
  rm.type = "button";
  rm.title = "Remove";
  rm.setAttribute("aria-label", "Remove " + baseName(path));
  rm.textContent = "\u00D7";
  node.append(thumb, name, rm);
  return node;
}

/* Thumbnails: at most 4 GetThumb calls in flight so 200+ photos never freeze the UI */
let thumbPending = [];
let thumbActive = 0;
let thumbGen = 0;
function loadThumbs(paths) {
  for (const p of paths) thumbPending.push(p);
  pumpThumbs();
}
function pumpThumbs() {
  const b = backend();
  if (!b) return;
  while (thumbActive < THUMB_CONCURRENCY && thumbPending.length) {
    const p = thumbPending.shift();
    if (!itemEls.has(p)) continue;
    thumbActive++;
    const gen = thumbGen;
    (async () => {
      try {
        const url = await b.GetThumb(p);
        const node = itemEls.get(p);
        if (gen === thumbGen && url && node) {
          const img = new Image();
          img.alt = "";
          img.draggable = false;
          img.src = url;
          const box = node.querySelector(".thumb");
          box.textContent = "";
          box.appendChild(img);
        }
      } catch (e) { /* thumbnail is optional */ }
      finally { thumbActive--; pumpThumbs(); }
    })();
  }
}

function addPathsToQueue(newPaths) {
  if (!Array.isArray(newPaths) || newPaths.length === 0) return 0;
  const have = new Set(queuePaths);
  const fresh = [];
  for (const p of newPaths) {
    if (typeof p === "string" && p && !have.has(p)) { have.add(p); fresh.push(p); }
  }
  if (!fresh.length) { setStatus("Those photos are already in the queue.", "idle"); return 0; }
  const startIndex = queuePaths.length;
  const frag = document.createDocumentFragment();
  for (const p of fresh) {
    queuePaths.push(p);
    const node = buildItem(p);
    itemEls.set(p, node);
    frag.appendChild(node);
  }
  el.fileList.appendChild(frag);
  updateQueueUI();
  loadThumbs(fresh);
  if (activeIndex < 0) selectIndex(startIndex);
  setStatus("Added " + fresh.length + " photo" + (fresh.length === 1 ? "" : "s") + " to the queue.", "ok");
  return fresh.length;
}

function selectIndex(i) {
  if (i < 0 || i >= queuePaths.length) return;
  activeIndex = i;
  const prev = el.fileList.querySelector(".item.active");
  if (prev) prev.classList.remove("active");
  const node = itemEls.get(queuePaths[i]);
  if (node) { node.classList.add("active"); node.scrollIntoView({ block: "nearest" }); }
  reqSeq++;            // anything still in flight belongs to the previous photo
  pendingFit = true;   // fit the new photo to the stage
  runPreview();
}

function removePath(path) {
  const idx = queuePaths.indexOf(path);
  if (idx < 0) return;
  queuePaths.splice(idx, 1);
  const node = itemEls.get(path);
  if (node) node.remove();
  itemEls.delete(path);
  if (queuePaths.length === 0) {
    activeIndex = -1;
    reqSeq++;
    clearViewer();
  } else if (idx === activeIndex) {
    activeIndex = -1;
    selectIndex(Math.min(idx, queuePaths.length - 1));
  } else if (idx < activeIndex) {
    activeIndex--;
  }
  updateQueueUI();
}

function clearQueue() {
  queuePaths = [];
  activeIndex = -1;
  reqSeq++;
  dirty = false;
  thumbGen++;
  thumbPending = [];
  el.fileList.textContent = "";
  itemEls.clear();
  previewCache.clear();
  el.pathInput.value = "";
  clearViewer();
  updateQueueUI();
  setStatus(HINT, "idle");
}

function navigate(delta) {
  if (!queuePaths.length) return;
  const next = clamp((activeIndex < 0 ? 0 : activeIndex) + delta, 0, queuePaths.length - 1);
  if (next !== activeIndex) selectIndex(next);
}

/* =====================================================================
   Viewer: zoom / pan / before-after split
   ===================================================================== */
let zoom = 1, panX = 0, panY = 0, imgW = 0, imgH = 0;
let hasImage = false, autoFit = true, splitFrac = 0.5;
let lastClean = "", lastOrig = "";

function applyTransform() {
  el.stage.style.transform = "translate3d(" + panX + "px," + panY + "px,0) scale(" + zoom + ")";
  el.zoomLbl.textContent = Math.round(zoom * 100) + "%";
  updateSplit();
}
function updateSplit() {
  const lineX = splitFrac * el.compareBox.clientWidth;
  el.sliderLine.style.left = lineX + "px";
  if (!hasImage) return;
  const localX = (lineX - panX) / zoom;                       // split position in image pixels
  el.origLayer.style.clipPath = "inset(0 " + clamp(imgW - localX, 0, imgW) + "px 0 0)";
}
function fitView() {
  if (!hasImage) return;
  const bw = el.compareBox.clientWidth, bh = el.compareBox.clientHeight;
  zoom = clamp(Math.min((bw - 32) / imgW, (bh - 32) / imgH), ZMIN, ZMAX);
  panX = (bw - imgW * zoom) / 2;
  panY = (bh - imgH * zoom) / 2;
  autoFit = true;
  applyTransform();
}
function zoomAt(nz, cx, cy) {
  if (!hasImage) return;
  nz = clamp(nz, ZMIN, ZMAX);
  const k = nz / zoom;
  panX = cx - (cx - panX) * k;
  panY = cy - (cy - panY) * k;
  zoom = nz;
  autoFit = false;
  applyTransform();
}
function zoomBy(factor) {
  zoomAt(zoom * factor, el.compareBox.clientWidth / 2, el.compareBox.clientHeight / 2);
}
function clearViewer() {
  el.imgClean.removeAttribute("src");
  el.imgOrig.removeAttribute("src");
  lastClean = lastOrig = "";
  hasImage = false;
  el.compareBox.classList.remove("has-image");
  zoom = 1; panX = panY = 0; autoFit = true;
  el.zoomLbl.textContent = "100%";
}

/* Canvas interaction */
function setMode(mode) {
  canvasMode = mode;
  el.modeCompare.classList.toggle("active", mode === "compare");
  el.modeMove.classList.toggle("active", mode === "move");
  el.compareBox.classList.toggle("mode-compare", mode === "compare");
  el.compareBox.classList.toggle("mode-move", mode === "move");
}
function setSplitFromEvent(e) {
  const r = el.compareBox.getBoundingClientRect();
  splitFrac = clamp((e.clientX - r.left) / r.width, 0, 1);
  updateSplit();
}
let drag = null;
function bindCanvas() {
  const box = el.compareBox;
  box.addEventListener("contextmenu", (e) => e.preventDefault());
  box.addEventListener("mousedown", (e) => { if (e.button === 1) e.preventDefault(); }); // no middle-click autoscroll
  box.addEventListener("pointerdown", (e) => {
    if (!hasImage) return;
    const panning = e.button === 1 || e.button === 2 || (e.button === 0 && (spaceDown || canvasMode === "move"));
    if (panning) {
      drag = { type: "pan", sx: e.clientX, sy: e.clientY, px: panX, py: panY };
      box.classList.add("panning");
    } else if (e.button === 0) {
      drag = { type: "split" };
      setSplitFromEvent(e);
    } else return;
    try { box.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    e.preventDefault();
  });
  box.addEventListener("pointermove", (e) => {
    if (!drag) return;
    if (drag.type === "pan") {
      panX = drag.px + (e.clientX - drag.sx);
      panY = drag.py + (e.clientY - drag.sy);
      autoFit = false;
      applyTransform();
    } else setSplitFromEvent(e);
  });
  const end = (e) => {
    if (!drag) return;
    drag = null;
    box.classList.remove("panning");
    try { box.releasePointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  };
  box.addEventListener("pointerup", end);
  box.addEventListener("pointercancel", end);
  box.addEventListener("wheel", (e) => {
    if (!hasImage) return;
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) {
      const r = box.getBoundingClientRect();
      zoomAt(zoom * Math.exp(-e.deltaY * 0.002), e.clientX - r.left, e.clientY - r.top);
    } else {                       // two-finger trackpad scroll pans
      panX -= e.deltaX; panY -= e.deltaY; autoFit = false; applyTransform();
    }
  }, { passive: false });
  box.addEventListener("dblclick", (e) => {
    if (!hasImage) return;
    const r = box.getBoundingClientRect();
    zoomAt(Math.abs(zoom - 1) < 0.02 ? 2 : 1, e.clientX - r.left, e.clientY - r.top);
  });
  if (window.ResizeObserver) {
    new ResizeObserver(() => { if (hasImage && autoFit) fitView(); else { applyTransform(); } }).observe(box);
  }
}

/* =====================================================================
   Preview pipeline: sequence guard + in-flight limiter + LRU cache
   ===================================================================== */
let reqSeq = 0;
let inFlight = false;
let dirty = false;
let pendingFit = false;
const previewCache = new Map();

const cacheKey = (p) => p + "|" + state.color + "|" + state.trans + "|" + state.bold + "|" + state.autoCrop;
function cacheGet(k) {
  if (!previewCache.has(k)) return null;
  const v = previewCache.get(k);
  previewCache.delete(k);
  previewCache.set(k, v);          // mark most-recently-used
  return v;
}
function cacheSet(k, v) {
  previewCache.delete(k);
  previewCache.set(k, v);
  while (previewCache.size > CACHE_MAX) previewCache.delete(previewCache.keys().next().value);
}

async function paint(res, mySeq) {
  // Decode off-screen first so both layers swap in the same frame (no flicker).
  const jobs = [];
  if (res.clean !== lastClean) { const a = new Image(); a.src = res.clean; jobs.push(a.decode().catch(() => {})); }
  if (res.orig !== lastOrig) { const b = new Image(); b.src = res.orig; jobs.push(b.decode().catch(() => {})); }
  if (jobs.length) await Promise.all(jobs);
  if (mySeq !== reqSeq) return;     // stale frame: discard

  const fit = pendingFit;
  pendingFit = false;
  imgW = res.w; imgH = res.h;
  el.stage.style.width = imgW + "px";
  el.stage.style.height = imgH + "px";
  if (res.clean !== lastClean) { el.imgClean.src = res.clean; lastClean = res.clean; }
  if (res.orig !== lastOrig) { el.imgOrig.src = res.orig; lastOrig = res.orig; }
  const o = el.imgOrig.style;       // keep the original aligned when the result is cropped
  o.left = -res.cropX + "px";
  o.top = -res.cropY + "px";
  o.width = res.origW + "px";
  o.height = res.origH + "px";

  const first = !hasImage;
  hasImage = true;
  el.compareBox.classList.add("has-image");
  if (fit || first || autoFit) fitView(); else applyTransform();
}

async function runPreview() {
  const path = queuePaths[activeIndex];
  const b = backend();
  if (!path || !b) return;

  const key = cacheKey(path);
  const cached = cacheGet(key);
  if (cached) {                     // 0ms path: already rendered before
    const seq = ++reqSeq;
    dirty = false;
    await paint(cached, seq);
    return;
  }
  if (inFlight) { dirty = true; return; }   // only one Go call at a time; latest state wins

  const mySeq = ++reqSeq;
  inFlight = true;
  try {
    const res = await b.GetPreview(path, state.color, state.trans, state.bold, state.autoCrop);
    if (mySeq !== reqSeq) return;           // stale response: discard
    if (!res || res.error) {
      setStatus("Can\u2019t preview " + baseName(path) + (res && res.error ? ": " + res.error : "."), "err");
      if (pendingFit) { clearViewer(); pendingFit = false; }
      return;
    }
    cacheSet(key, res);
    await paint(res, mySeq);
  } catch (err) {
    if (mySeq === reqSeq) setStatus("Preview failed: " + ((err && err.message) || err), "err");
  } finally {
    inFlight = false;
    if (dirty) { dirty = false; runPreview(); }
  }
}

/* RAF-throttled slider input */
let rafPending = false;
function schedulePreview() {
  if (rafPending) return;
  rafPending = true;
  requestAnimationFrame(() => { rafPending = false; runPreview(); });
}
function updateSliderUI() {
  el.transVal.textContent = state.trans + "%";
  el.boldVal.textContent = state.bold + "%";
  el.transSlider.style.setProperty("--p", state.trans + "%");
  el.boldSlider.style.setProperty("--p", state.bold + "%");
}

/* =====================================================================
   Actions
   ===================================================================== */
function setBusy(b) { isBusy = b; updateButtons(); }
const isErr = (m) => typeof m === "string" && /^Error/i.test(m);

async function pickFiles() {
  const b = backend(); if (!b) return;
  try { const p = await b.SelectFiles(); if (p && p.length) addPathsToQueue(p); }
  catch (err) { setStatus("Could not open the file picker.", "err"); }
}
async function pickFolder() {
  const b = backend(); if (!b) return;
  try {
    const p = await b.SelectFolder();
    if (p && p.length) addPathsToQueue(p);
    else if (Array.isArray(p) && p.length === 0) { /* cancelled or no photos */ }
  } catch (err) { setStatus("Could not open the folder picker.", "err"); }
}
async function submitPath() {
  const b = backend(); if (!b) return;
  const val = el.pathInput.value.trim();
  if (!val) return;
  try {
    const paths = await b.ResolvePath(val);
    if (paths && paths.length) { addPathsToQueue(paths); el.pathInput.value = ""; }
    else setStatus("No photos found at that path.", "err");
  } catch (err) { setStatus("Could not read that path.", "err"); }
}
function onFilesDropped(paths) {
  if (!paths || !paths.length) { setStatus("No supported photos in what you dropped.", "err"); return; }
  addPathsToQueue(paths);
}

async function saveCurrent() {
  const b = backend();
  if (!b || isBusy || activeIndex < 0) return;
  setBusy(true);
  setStatus("Saving HD PNG\u2026", "busy");
  try {
    const msg = await b.SaveOne(queuePaths[activeIndex], state.color, state.trans, state.bold, state.autoCrop, state.formSize);
    setStatus(msg, isErr(msg) ? "err" : "ok");
  } catch (err) { setStatus("Save failed: " + ((err && err.message) || err), "err"); }
  finally { setBusy(false); }
}
let doneTimer = 0;
async function processAll() {
  const b = backend();
  if (!b || isBusy || !queuePaths.length) return;
  const n = queuePaths.length;
  setBusy(true);
  setStatus("Processing " + n + " photo" + (n === 1 ? "" : "s") + " in HD\u2026", "busy");
  try {
    const msg = await b.ProcessBatch(queuePaths.slice(), state.color, state.trans, state.bold, state.autoCrop, state.formSize);
    setStatus(msg, isErr(msg) ? "err" : "ok");
    if (!isErr(msg)) {
      el.btnProcessAll.classList.add("done");
      clearTimeout(doneTimer);
      doneTimer = setTimeout(() => el.btnProcessAll.classList.remove("done"), 1800);
    }
  } catch (err) { setStatus("Processing failed: " + ((err && err.message) || err), "err"); }
  finally { setBusy(false); }
}
async function openOut() {
  const b = backend(); if (!b || !queuePaths.length) return;
  try { await b.OpenOutFolder(queuePaths[0] || ""); setStatus("Opening the output folder\u2026", "ok"); }
  catch (err) { setStatus("Could not open the folder.", "err"); }
}
async function exportZip() {
  const b = backend();
  if (!b || isBusy || !queuePaths.length) return;
  setBusy(true);
  setStatus("Creating ZIP\u2026", "busy");
  try {
    const msg = await b.ExportZip(queuePaths[0] || "");
    setStatus(msg, isErr(msg) ? "err" : "ok");
  } catch (err) { setStatus("ZIP export failed: " + ((err && err.message) || err), "err"); }
  finally { setBusy(false); }
}

/* =====================================================================
   Wiring
   ===================================================================== */
function bindUI() {
  el.btnFiles.addEventListener("click", pickFiles);
  el.btnFolder.addEventListener("click", pickFolder);
  el.btnClear.addEventListener("click", clearQueue);
  el.btnSaveOne.addEventListener("click", saveCurrent);
  el.btnProcessAll.addEventListener("click", processAll);
  el.btnOpenOut.addEventListener("click", openOut);
  el.btnExportZip.addEventListener("click", exportZip);

  el.pathInput.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); submitPath(); } });
  el.pathInput.addEventListener("paste", () => setTimeout(submitPath, 0));

  // Queue: select item or remove it (event delegation)
  el.fileList.addEventListener("click", (e) => {
    const item = e.target.closest(".item");
    if (!item) return;
    const path = item.dataset.path;
    if (e.target.closest(".item-remove")) { e.stopPropagation(); removePath(path); return; }
    const i = queuePaths.indexOf(path);
    if (i >= 0 && i !== activeIndex) selectIndex(i);
  });

  // Preview background swatches
  el.bgSeg.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-bg]");
    if (!btn) return;
    el.bgSeg.querySelectorAll("button").forEach((x) => x.classList.toggle("active", x === btn));
    el.compareBox.classList.remove("bg-checker", "bg-white", "bg-dark");
    el.compareBox.classList.add("bg-" + btn.dataset.bg);
  });

  // Canvas mode + zoom
  el.modeCompare.addEventListener("click", () => setMode("compare"));
  el.modeMove.addEventListener("click", () => setMode("move"));
  el.zoomIn.addEventListener("click", () => zoomBy(1.25));
  el.zoomOut.addEventListener("click", () => zoomBy(0.8));
  el.zoomFit.addEventListener("click", fitView);

  // Studio controls
  el.colorSeg.addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-color]");
    if (!btn || btn.dataset.color === state.color) return;
    el.colorSeg.querySelectorAll("button").forEach((x) => x.classList.toggle("active", x === btn));
    state.color = btn.dataset.color;
    schedulePreview();
  });
  el.transSlider.addEventListener("input", () => { state.trans = parseInt(el.transSlider.value, 10) || 0; updateSliderUI(); schedulePreview(); });
  el.boldSlider.addEventListener("input", () => { state.bold = parseInt(el.boldSlider.value, 10) || 0; updateSliderUI(); schedulePreview(); });
  el.autoCrop.addEventListener("change", () => { state.autoCrop = el.autoCrop.checked; pendingFit = true; schedulePreview(); });
  el.formSize.addEventListener("change", () => {
    state.formSize = el.formSize.checked;
    setStatus(state.formSize ? "Form size (600\u00D7200) is applied when you save or process." : HINT, "idle");
  });

  bindCanvas();

  // Keyboard shortcuts (ignored while typing in the path box)
  window.addEventListener("keydown", (e) => {
    const ae = document.activeElement;
    if (ae === el.pathInput) return;
    const mod = e.ctrlKey || e.metaKey;
    const key = e.key;
    if (mod && key.toLowerCase() === "o") { e.preventDefault(); if (e.shiftKey) pickFolder(); else pickFiles(); return; }
    if (mod && key.toLowerCase() === "s") { e.preventDefault(); saveCurrent(); return; }
    if (mod && key === "Enter") { e.preventDefault(); processAll(); return; }
    if (e.code === "Space") {
      e.preventDefault();
      if (!spaceDown) { spaceDown = true; el.compareBox.classList.add("space-pan"); }
      return;
    }
    if (key === "+" || key === "=") { e.preventDefault(); zoomBy(1.25); return; }
    if (key === "-" || key === "_") { e.preventDefault(); zoomBy(0.8); return; }
    if (key === "0") { e.preventDefault(); fitView(); return; }
    if ((key === "ArrowUp" || key === "ArrowDown") && !(ae && ae.type === "range")) {
      e.preventDefault();
      navigate(key === "ArrowUp" ? -1 : 1);
    }
  });
  window.addEventListener("keyup", (e) => {
    if (e.code === "Space") {
      if (document.activeElement !== el.pathInput) e.preventDefault(); // stop Space from clicking a focused button
      spaceDown = false;
      el.compareBox.classList.remove("space-pan");
    }
  });
  window.addEventListener("blur", () => { spaceDown = false; el.compareBox.classList.remove("space-pan"); });

  // Never let the webview navigate to a dropped file; Wails handles drops natively in Go.
  window.addEventListener("dragover", (e) => e.preventDefault());
  window.addEventListener("drop", (e) => e.preventDefault());
}

/* =====================================================================
   Startup
   ===================================================================== */
function waitFor(test, timeoutMs) {
  return new Promise((resolve) => {
    const t0 = performance.now();
    (function poll() {
      if (test()) return resolve(true);
      if (performance.now() - t0 > timeoutMs) return resolve(false);
      setTimeout(poll, 30);
    })();
  });
}

async function init() {
  initTheme();
  bindUI();
  updateSliderUI();
  updateQueueUI();
  setStatus("Starting\u2026", "busy");

  const ready = await waitFor(() => !!backend(), 10000);
  if (!ready) { setStatus("The Photo BG engine did not start. Please restart the app.", "err"); return; }
  await waitFor(() => !!(window.runtime && typeof window.runtime.EventsOn === "function"), 3000);
  if (window.runtime && window.runtime.EventsOn) window.runtime.EventsOn("files-dropped", (paths) => onFilesDropped(paths));

  try {
    const def = await backend().GetDefaultFolder();   // returns "" so the app always starts clean
    if (def) addPathsToQueue((await backend().ResolvePath(def)) || []);
  } catch (err) { /* start clean */ }
  setStatus(HINT, "idle");
}

init();
})();
</script>
